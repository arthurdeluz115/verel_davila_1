        (function(){
          var URL_ACEITAR = 'https://pay.hub.la/RcZmfIc5zykL0ESBAqWc/upsell';
          var URL_RECUSAR = '/downsell_hubla';

          function comParametros(destino){
            var url;
            try { url = new URL(destino, location.href); } catch(e){ return destino; }
            new URLSearchParams(location.search).forEach(function(valor, chave){
              if (!url.searchParams.has(chave)) url.searchParams.set(chave, valor);
            });
            return url.toString();
          }

          document.getElementById('btn-aceitar-upsell').addEventListener('click', function(){
            location.href = comParametros(URL_ACEITAR);
          });
          document.getElementById('btn-recusar-upsell').addEventListener('click', function(){
